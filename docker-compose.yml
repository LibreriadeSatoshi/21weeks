services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: mysql://21weeks:21weeks@db:3306/21weeks
      # Proveedor de IA OpenAI-compatible (elige el tuyo):
      #   Moonshot:  https://api.moonshot.cn/v1   (modelo p.ej. kimi-k2-0905-preview)
      #   OpenAI:    https://api.openai.com/v1    (modelo p.ej. gpt-4o)
      AI_BASE_URL: ${AI_BASE_URL:?define AI_BASE_URL en .env}
      AI_API_KEY: ${AI_API_KEY:?define AI_API_KEY en .env}
      AI_MODEL_ID: ${AI_MODEL_ID:?define AI_MODEL_ID en .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: 21weeks
      MYSQL_USER: 21weeks
      MYSQL_PASSWORD: 21weeks
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u21weeks", "-p21weeks"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dbdata:
